# Effect-v3 Stage 2 — RoboCasa Atomic-5.  Requires the baseline environment
# plus BEHAVIOR_MEMORY_BANK and BEHAVIOR_PHASE_CACHE from the delivered VBE.

[job]
task = "vfm"
experiment = "action_policy_robocasa365_atomic5_cosmos_behavior_stage2"
project = "cosmos_behavior"
group = "stage2_robocasa_atomic5_effect_v3"
name = "stage2_robocasa_atomic5_effect_v3_smoke"
wandb_mode = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 2.0e-4

[scheduler]
cycle_lengths = [100000]

[dataloader_train]
max_samples_per_batch = 16

[trainer]
max_iter = 20
logging_iter = 1
grad_accum_iter = 1

[trainer.callbacks.compile_tokenizer]
enabled = true
warmup_resolutions = ["480"]

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 20
